<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Product • Urban Style</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #111827 60%, #1f2937 100%); color: #f9fafb; }
    .navbar { background: rgba(15, 23, 42, 0.95); }
    .panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 1.3rem; }
    .btn-accent { background: linear-gradient(90deg, #f59e0b, #fb923c); color: #fff; border: none; }
    .product-large { width: 100%; max-height: 540px; object-fit: cover; border-radius: 1rem; }
  </style>
</head>
<body>
  <nav class='navbar navbar-expand-lg navbar-dark sticky-top'>
    <div class='container'>
      <a class='navbar-brand fw-bold' href='index.html'>Urban Style</a>
      <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navMenu'>
        <span class='navbar-toggler-icon'></span>
      </button>
      <div class='collapse navbar-collapse' id='navMenu'>
        <ul class='navbar-nav ms-auto mb-2 mb-lg-0'>
          <li class='nav-item'><a class='nav-link' href='index.html'>Home</a></li>
          <li class='nav-item'><a class='nav-link' href='cart.html'>Cart <span id='cartCount' class='badge bg-warning text-dark'>0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class='container py-5'>
    <div id='productContainer'></div>
  </main>

  <footer class='footer'>
    <div class='container d-flex justify-content-between'>
      <span>© 2026 Urban Style</span>
    </div>
  </footer>

  <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
  <script src='assets/products.js'></script>
  <script>
    function qs(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function renderProductDetail(product) {
      if (!product) {
        document.getElementById('productContainer').innerHTML = '<div class="panel p-4">Product not found.</div>';
        return;
      }
      document.getElementById('productContainer').innerHTML = `
        <div class='row g-4'>
          <div class='col-md-6'>
            <div class='panel p-4'>
              <img src='${product.image}' alt='${product.name}' class='product-large'>
            </div>
          </div>
          <div class='col-md-6'>
            <div class='panel p-4'>
              <h2 class='fw-bold mb-2'>${product.name}</h2>
              <p class='text-light-emphasis mb-3'>${product.description}</p>
              <div class='fw-bold fs-4 mb-3'>$${product.price}</div>
              <div class='d-flex gap-2'>
                <button id='addCartBtn' class='btn btn-accent'>Add to Cart</button>
                <a href='cart.html' class='btn btn-outline-light'>View Cart</a>
              </div>
              <p id='msg' class='mt-3 small text-light-emphasis'></p>
            </div>
          </div>
        </div>`;

      document.getElementById('addCartBtn').addEventListener('click', () => {
        addToCart(product.id, 1);
        const msg = document.getElementById('msg');
        msg.innerHTML = '<div class="alert alert-success">Added to cart.</div>';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const id = qs('id');
      const product = getProductById(id);
      renderProductDetail(product);
    });
  </script>
</body>
</html>
