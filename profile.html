<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Profile | Urban Style</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #111827 0%, #0f172a 100%); color: #f9fafb; }
    .navbar { background: rgba(15, 23, 42, 0.96); }
    .profile-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 1.3rem; }
    .btn-accent { background: linear-gradient(90deg, #f59e0b, #fb923c); color: #fff; border: none; }
    .btn-accent:hover { color: #fff; }
  </style>
</head>
<body>
  <nav class='navbar navbar-expand-lg navbar-dark sticky-top'>
    <div class='container'>
      <a class='navbar-brand fw-bold' href='index.html'>Urban Style</a>
      <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navMenu'>
        <span class='navbar-toggler-icon'></span>
      </button>
      <div class='collapse navbar-collapse' id='navMenu'>
        <ul class='navbar-nav ms-auto mb-2 mb-lg-0'>
          <li class='nav-item'><a class='nav-link' href='index.html'>Home</a></li>
          <li class='nav-item'><a class='nav-link' href='contact.html'>Contact</a></li>
          <li class='nav-item' id='authNavLinks'></li>
          <li class='nav-item'><a class='nav-link active' href='profile.html'>Profile</a></li>
          <li class='nav-item'><a class='nav-link' href='cart.html'>Cart <span id='cartCount' class='badge bg-warning text-dark'>0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class='py-5'>
    <div class='container'>
      <div class='row g-4'>
        <div class='col-lg-4'>
          <div class='profile-card p-4 text-center'>
            <div class='rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center mx-auto mb-3' style='width: 90px; height: 90px; font-size: 2rem;'>U</div>
            <h3 id='profileName' class='fw-bold'>Your profile</h3>
            <p id='profileEmail' class='text-light-emphasis'></p>
            <p class='small text-light-emphasis'>Member since 2026</p>
            <button class='btn btn-outline-light mt-2' onclick='logout(event)'>Logout</button>
          </div>
        </div>
        <div class='col-lg-8'>
          <div class='profile-card p-4'>
            <h3 class='fw-bold mb-4'>Update your information</h3>
            <form id='profileForm'>
              <div class='row g-3'>
                <div class='col-md-6'>
                  <label class='form-label'>Full name</label>
                  <input type='text' class='form-control' id='name' required>
                </div>
                <div class='col-md-6'>
                  <label class='form-label'>Email</label>
                  <input type='email' class='form-control' id='email' required>
                </div>
                <div class='col-md-6'>
                  <label class='form-label'>Phone</label>
                  <input type='tel' class='form-control' id='phone' required>
                </div>
                <div class='col-md-6'>
                  <label class='form-label'>Address</label>
                  <input type='text' class='form-control' id='address' required>
                </div>
                <div class='col-md-6'>
                  <label class='form-label'>Password</label>
                  <input type='password' class='form-control' id='password' required>
                </div>
              </div>
              <button type='submit' class='btn btn-accent mt-4'>Save Changes</button>
            </form>
            <div id='profileMessage' class='mt-3'></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
  <script>
    const userKey = 'urbanUsers';
    const cartKey = 'urbanCart';
    const sessionKey = 'urbanUser';
    const legacySessionKey = 'urbanSession';

    function loadCart() {
      return JSON.parse(localStorage.getItem(cartKey) || '[]');
    }

    function updateCartBadge() {
      const cart = loadCart();
      document.getElementById('cartCount').textContent = cart.length;
    }

    function loadCurrentUser() {
      try {
        return JSON.parse(localStorage.getItem(sessionKey) || localStorage.getItem(legacySessionKey) || 'null');
      } catch {
        return null;
      }
    }

    function saveCurrentUser(user) {
      localStorage.setItem(sessionKey, JSON.stringify(user));
      localStorage.setItem(legacySessionKey, JSON.stringify(user));
    }

    function logout(event) {
      if (event) {
        event.preventDefault();
      }
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(legacySessionKey);
      window.location.href = 'login.html';
    }

    function updateAuthNav() {
      const authNavLinks = document.getElementById('authNavLinks');
      if (!authNavLinks) return;

      authNavLinks.innerHTML = '';
      const currentUser = loadCurrentUser();

      if (currentUser) {
        const profileLink = document.createElement('a');
        profileLink.className = 'nav-link text-warning fw-semibold';
        profileLink.href = 'profile.html';
        profileLink.textContent = currentUser.name;

        const logoutLink = document.createElement('a');
        logoutLink.className = 'nav-link';
        logoutLink.href = '#';
        logoutLink.textContent = 'Logout';
        logoutLink.addEventListener('click', logout);

        authNavLinks.appendChild(profileLink);
        authNavLinks.appendChild(logoutLink);
      } else {
        const loginLink = document.createElement('a');
        loginLink.className = 'nav-link';
        loginLink.href = 'login.html';
        loginLink.textContent = 'Login';

        const registerLink = document.createElement('a');
        registerLink.className = 'nav-link';
        registerLink.href = 'register.html';
        registerLink.textContent = 'Register';

        authNavLinks.appendChild(loginLink);
        authNavLinks.appendChild(registerLink);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      updateAuthNav();
      const currentUser = loadCurrentUser();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profileName').textContent = currentUser.name;
      document.getElementById('profileEmail').textContent = currentUser.email;
      document.getElementById('name').value = currentUser.name;
      document.getElementById('email').value = currentUser.email;
      document.getElementById('phone').value = currentUser.phone || '';
      document.getElementById('address').value = currentUser.address || '';
      document.getElementById('password').value = currentUser.password || '';

      document.getElementById('profileForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const updatedUser = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          address: document.getElementById('address').value.trim(),
          password: document.getElementById('password').value.trim()
        };

        const users = JSON.parse(localStorage.getItem(userKey) || '[]');
        const index = users.findIndex(item => item.email === currentUser.email);
        if (index >= 0) {
          users[index] = updatedUser;
          localStorage.setItem(userKey, JSON.stringify(users));
        }

        saveCurrentUser(updatedUser);
        updateAuthNav();
        document.getElementById('profileName').textContent = updatedUser.name;
        document.getElementById('profileEmail').textContent = updatedUser.email;
        document.getElementById('profileMessage').innerHTML = '<div class="alert alert-success">Profile updated successfully.</div>';
      });
    });
  </script>
</body>
</html>
