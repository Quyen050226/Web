<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Login | Urban Style</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #111827 0%, #0f172a 60%, #1f2937 100%); color: #f9fafb; }
    .navbar { background: rgba(15, 23, 42, 0.96); }
    .auth-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 1.4rem; backdrop-filter: blur(18px); }
    .btn-accent { background: linear-gradient(90deg, #f59e0b, #fb923c); color: #fff; border: none; }
    .btn-accent:hover { color: #fff; }
    .small-link { color: #fbbf24; text-decoration: none; }
  </style>
</head>
<body>
  <nav class='navbar navbar-expand-lg navbar-dark sticky-top'>
    <div class='container'>
      <a class='navbar-brand fw-bold' href='index.html'>Urban Style</a>
      <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navMenu'>
        <span class='navbar-toggler-icon'></span>
      </button>
      <div class='collapse navbar-collapse' id='navMenu'>
        <ul class='navbar-nav ms-auto mb-2 mb-lg-0'>
          <li class='nav-item'><a class='nav-link' href='index.html'>Home</a></li>
          <li class='nav-item'><a class='nav-link' href='contact.html'>Contact</a></li>
          <li class='nav-item' id='authNavLinks'></li>
          <li class='nav-item'><a class='nav-link' href='profile.html'>Profile</a></li>
          <li class='nav-item'><a class='nav-link' href='cart.html'>Cart <span id='cartCount' class='badge bg-warning text-dark'>0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class='py-5'>
    <div class='container'>
      <div class='row justify-content-center'>
        <div class='col-lg-5'>
          <div class='auth-card p-4 p-md-5'>
            <h2 class='fw-bold mb-3'>Welcome back</h2>
            <p class='text-light-emphasis mb-4'>Sign in to access your order history, profile details, and saved cart.</p>
            <form id='loginForm' novalidate>
              <div class='mb-3'>
                <label class='form-label'>Email address</label>
                <input type='email' class='form-control' id='email' required>
              </div>
              <div class='mb-3'>
                <label class='form-label'>Password</label>
                <input type='password' class='form-control' id='password' required>
              </div>
              <button type='submit' class='btn btn-accent w-100'>Login</button>
            </form>
            <p class='mt-3 mb-0 text-light-emphasis'>No account yet? <a class='small-link' href='register.html'>Create one here</a></p>
            <div id='loginMessage' class='mt-3'></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
  <script>
    const userKey = 'urbanUsers';
    const cartKey = 'urbanCart';
    const sessionKey = 'urbanUser';
    const legacySessionKey = 'urbanSession';

    function loadCart() {
      return JSON.parse(localStorage.getItem(cartKey) || '[]');
    }

    function updateCartBadge() {
      const cart = loadCart();
      document.getElementById('cartCount').textContent = cart.length;
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem(userKey) || '[]');
    }

    function loadCurrentUser() {
      try {
        return JSON.parse(localStorage.getItem(sessionKey) || localStorage.getItem(legacySessionKey) || 'null');
      } catch {
        return null;
      }
    }

    function saveCurrentUser(user) {
      localStorage.setItem(sessionKey, JSON.stringify(user));
      localStorage.setItem(legacySessionKey, JSON.stringify(user));
    }

    function logoutUser(event) {
      event.preventDefault();
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(legacySessionKey);
      window.location.href = 'login.html';
    }

    function updateAuthNav() {
      const authNavLinks = document.getElementById('authNavLinks');
      if (!authNavLinks) return;

      authNavLinks.innerHTML = '';
      const currentUser = loadCurrentUser();

      if (currentUser) {
        const profileLink = document.createElement('a');
        profileLink.className = 'nav-link text-warning fw-semibold';
        profileLink.href = 'profile.html';
        profileLink.textContent = currentUser.name;

        const logoutLink = document.createElement('a');
        logoutLink.className = 'nav-link';
        logoutLink.href = '#';
        logoutLink.textContent = 'Logout';
        logoutLink.addEventListener('click', logoutUser);

        authNavLinks.appendChild(profileLink);
        authNavLinks.appendChild(logoutLink);
      } else {
        const loginLink = document.createElement('a');
        loginLink.className = 'nav-link active';
        loginLink.href = 'login.html';
        loginLink.textContent = 'Login';

        const registerLink = document.createElement('a');
        registerLink.className = 'nav-link';
        registerLink.href = 'register.html';
        registerLink.textContent = 'Register';

        authNavLinks.appendChild(loginLink);
        authNavLinks.appendChild(registerLink);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      updateAuthNav();

      const currentUser = loadCurrentUser();
      if (currentUser) {
        window.location.href = 'profile.html';
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const messageBox = document.getElementById('loginMessage');

        if (!email || !password) {
          messageBox.innerHTML = '<div class="alert alert-warning">Please enter your email and password.</div>';
          return;
        }

        const users = getUsers();
        const matchedUser = users.find(user => user.email === email && user.password === password);

        if (!matchedUser) {
          messageBox.innerHTML = '<div class="alert alert-danger">Invalid login details. Please try again.</div>';
          return;
        }

        saveCurrentUser(matchedUser);
        updateAuthNav();
        messageBox.innerHTML = '<div class="alert alert-success">Login successful. Redirecting to your profile...</div>';
        setTimeout(() => window.location.href = 'profile.html', 900);
      });
    });
  </script>
</body>
</html>
